kind = "web"
previewPath = "/"
title = "DMTECHY Agency Website"
version = "1.0.0"
id = "artifacts/dmtechy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24436

[services.development]
run = "pnpm --filter @workspace/dmtechy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dmtechy", "run", "build" ]
publicDir = "artifacts/dmtechy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24436"
BASE_PATH = "/"
